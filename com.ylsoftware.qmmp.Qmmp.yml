app-id: com.ylsoftware.qmmp.Qmmp
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: qmmp
rename-icon: qmmp
rename-desktop-file: qmmp.desktop
rename-appdata-file: com.ylsoftware.qmmp.metainfo.xml

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
  - --filesystem=xdg-music
  - --env=QT_QPA_PLATFORM=wayland;xcb

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/aclocal
  - /share/doc
  - /share/man
  - '*.a'
  - '*.la'

modules:
  - name: libcddb
    buildsystem: autotools
    sources:
      - type: archive
        url: https://prdownloads.sourceforge.net/libcddb/libcddb-1.3.2.tar.bz2
        sha256: 35ce0ee1741ea38def304ddfe84a958901413aa829698357f0bee5bb8f0a223b
        x-checker-data:
          type: anitya
          project-id: 1572
          url-template: https://prdownloads.sourceforge.net/libcddb/libcddb-$version.tar.bz2
      - type: patch
        path: pointer-types.patch
      - type: shell
        commands:
          - cp -p /usr/share/automake-*/config.{sub,guess} .

  - name: libcdio-C
    config-opts:
      - --without-cd-drive
      - --without-cd-info
      - --without-cdda-player
      - --without-cd-read
      - --without-iso-info
      - --without-iso-read
      - --with-pic
      - --disable-static
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://github.com/libcdio/libcdio-C/releases/download/2.4.0/libcdio-2.4.0.tar.gz
        sha256: bf7cde63762bb12db7755c395c441e49406fde7e1d9f9a9be7e3b940b1f405d7
        x-checker-data:
          type: json
          url: https://api.github.com/repos/libcdio/libcdio-C/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name=="libcdio-" + $version + ".tar.gz")
            | .browser_download_url

  - name: soxr
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: archive
        url: http://downloads.sourceforge.net/soxr/soxr-0.1.3-Source.tar.xz
        sha256: b111c15fdc8c029989330ff559184198c161100a59312f5dc19ddeb9b5a15889
        x-checker-data:
          type: anitya
          project-id: 4859
          stable-only: true
          url-template: http://downloads.sourceforge.net/soxr/soxr-$version-Source.tar.xz

  - name: libgme
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/libgme/game-music-emu/releases/download/0.6.5/libgme-0.6.5-src.tar.gz
        sha256: a133f19278222136ba0d8c27b64a07987ba05fec9d2e6d293ccd8cabdd97ddbb
        x-checker-data:
          type: json
          url: https://api.github.com/repos/libgme/game-music-emu/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name=="libgme-" + $version + "-src.tar.gz")
            | .browser_download_url

  - name: libshout
    buildsystem: autotools
    sources:
      - type: archive
        url: https://downloads.xiph.org/releases/libshout/libshout-2.4.6.tar.gz
        sha256: 39cbd4f0efdfddc9755d88217e47f8f2d7108fa767f9d58a2ba26a16d8f7c910
        x-checker-data:
          type: anitya
          project-id: 11084
          stable-only: true
          url-template: https://downloads.xiph.org/releases/libshout/libshout-$version.tar.gz

  - name: libxmp
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/libxmp/libxmp/releases/download/libxmp-4.7.4/libxmp-4.7.4.tar.gz
        sha256: a25583aa3b031c78ba0b4e83387fa596fb05742622e60f60d1540ee2af79b8d9
        x-checker-data:
          type: json
          url: https://api.github.com/repos/libxmp/libxmp/releases/latest
          version-query: .tag_name | sub("^libxmp-"; "")
          url-query: .assets[] | select(.name=="libxmp-" + $version + ".tar.gz") |
            .browser_download_url

  - name: qmmp
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://qmmp.ylsoftware.com/files/qmmp/2.4/qmmp-2.4.2.tar.bz2
        sha256: 8042f83a9ed810e170f7127e6eb53c6b29038dbf504a01c0867c19e5fd200e7d
        x-checker-data:
          type: anitya
          project-id: 4129
          stable-only: true
          url-template: https://qmmp.ylsoftware.com/files/qmmp/$major.$minor/qmmp-$version.tar.bz2
      - type: patch
        path: fix-appdata.patch
